<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Estate</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-wrapper">
        <button
          type="button"
          aria-label="open-navigation"
          aria-expanded="false"
          class="hamburger menu"
          aria-controls="navigation-item"
        >
          <svg viewBox="0 0 100 60" width="25" height="25">
            <rect width="100" height="10" y="10" class="line top"></rect>
            <rect width="80" height="10" y="30" class="line middle"></rect>
            <rect width="50" height="10" y="50" class="line bottom"></rect>
          </svg>
        </button>

        <img src="assets/images/logo.svg" alt="Real Estate Logo" />
      </div>

      <nav class="navigation" role="navigation" aria-label="Main Navigation" id="navigation-item">
        <button type="button" aria-label="close navigation" class="hamburger menu" aria-controls="navigation-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <!-- !Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
            <path
              d="M504.6 148.5C515.9 134.9 514.1 114.7 500.5 103.4C486.9 92.1 466.7 93.9 455.4 107.5L320 270L184.6 107.5C173.3 93.9 153.1 92.1 139.5 103.4C125.9 114.7 124.1 134.9 135.4 148.5L278.3 320L135.4 491.5C124.1 505.1 125.9 525.3 139.5 536.6C153.1 547.9 173.3 546.1 184.6 532.5L320 370L455.4 532.5C466.7 546.1 486.9 547.9 500.5 536.6C514.1 525.3 515.9 505.1 504.6 491.5L361.7 320L504.6 148.5z"
            />
          </svg>
        </button>
        <ul>
          <li><a href="#">Projects</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">About Us</a></li>
        </ul>
      </nav>

      <button type="button" class="contact-btn">Contact Us</button>
    </header>
    <main>
      <section class="hero">
        <div class="hero-text-wrapper">
          <h1>Find Your Dream Home</h1>
          <p>
            Explore our curated selection of exquisite properties meticulously tailored to your unique dream home vision
          </p>
          <button type="button">Contact Us</button>
        </div>

        <img src="assets/images/hero image 1 (2).png" alt="house" class="hero-img" />
      </section>
    </main>

    <script src="main.js" defer></script>
  </body>
</html>
